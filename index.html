<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSL - Experience Leadership</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            z-index: 100;
        }

        .container { width: 95%; max-width: 600px; }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 32px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
        }

        h1.logo { font-size: 3rem; font-weight: 800; background: linear-gradient(to right, #818cf8, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sub-logo { color: var(--text-muted); letter-spacing: 4px; font-size: 0.65rem; margin-bottom: 30px; text-transform: uppercase; }

        .progress-container { background: rgba(255, 255, 255, 0.05); height: 8px; border-radius: 10px; margin-bottom: 35px; }
        .progress-fill { background: linear-gradient(90deg, var(--primary), var(--secondary)); height: 100%; border-radius: 10px; transition: 0.4s ease; width: 0%; }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 18px;
            width: 100%;
            border-radius: 16px;
            margin-bottom: 12px;
            text-align: left;
            cursor: pointer;
            color: var(--text-main);
            transition: 0.3s;
        }
        .option-btn.selected { background: var(--primary); border-color: var(--primary); }

        .btn-nav { padding: 14px 28px; border-radius: 14px; font-weight: 700; cursor: pointer; border: none; text-transform: uppercase; }
        .btn-next { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; flex-grow: 1; }
        
        .rtl { direction: rtl; text-align: right; }
        .rtl .option-btn { text-align: right; }

        .score-big { font-size: 5rem; font-weight: 800; margin: 15px 0; color: white; }
        .stats-box { background: rgba(0, 0, 0, 0.2); border-radius: 24px; padding: 25px; margin: 25px 0; }
        .stat-row { margin-bottom: 15px; text-align: left; }
        .stat-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 5px; }
        .stat-bar-bg { background: rgba(255, 255, 255, 0.05); height: 6px; border-radius: 10px; }
        .stat-bar-fill { background: var(--primary); height: 100%; width: 50%; }
        .box-info { padding: 15px; border-radius: 12px; text-align: left; margin-bottom: 10px; font-size: 0.85rem; }
        .box-green { background: rgba(34, 197, 94, 0.1); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.2); }
        .box-orange { background: rgba(249, 115, 22, 0.1); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.2); }
    </style>
</head>
<body>

    <select class="lang-switcher" onchange="changeLang(this.value)">
        <option value="fr">Français</option>
        <option value="ar">العربية</option>
        <option value="en">English</option>
    </select>

<div class="container" id="main-container">
    <div id="home-card" class="card">
        <h1 class="logo">TSL</h1>
        <p class="sub-logo" id="text-sub-logo">Rapport de Leadership</p>
        <h2 id="text-home-title">Analyse de Style</h2><br>
        <p style="color: var(--text-muted); margin-bottom: 25px;" id="text-home-desc">Évaluez votre profil de leader à travers 16 situations simples.</p>
        <button class="btn-nav btn-next" style="width: 100%; padding: 22px;" id="text-start-btn" onclick="startTest()">Commencer</button>
    </div>

    <div id="quiz-card" class="card" style="display: none;">
        <div class="progress-container"><div id="progress" class="progress-fill"></div></div>
        <p id="q-number" style="font-size: 0.75rem; color: var(--primary); font-weight: 800; margin-bottom: 10px;"></p>
        <h2 id="q-text" style="margin-bottom: 30px;"></h2>
        <div id="options"></div>
        <div style="display: flex; gap: 15px; margin-top: 20px;">
            <button id="prev-btn" class="btn-nav" style="background: transparent; color: white; border: 1px solid var(--glass-border);" onclick="changeQuestion(-1)">Retour</button>
            <button id="next-btn" class="btn-nav btn-next" onclick="changeQuestion(1)" disabled>Suivant</button>
            <button id="result-btn" class="btn-nav btn-next" onclick="finish()" style="display: none;">Résultats</button>
        </div>
    </div>

    <div id="result-card" class="card" style="display: none;">
        <h1 class="logo">TSL</h1>
        <p class="sub-logo">Rapport Final</p>
        <div class="score-big">100%</div>
        <p id="text-global-lead" style="color: var(--primary); font-size: 0.8rem; font-weight: 800; text-transform: uppercase;">Leadership Global</p>
        
        <div class="stats-box">
            <div class="stat-row"><div class="stat-info"><span class="t-social">Social</span><span>80%</span></div><div class="stat-bar-bg"><div class="stat-bar-fill"></div></div></div>
            <div class="stat-row"><div class="stat-info"><span class="t-vision">Vision</span><span>70%</span></div><div class="stat-bar-bg"><div class="stat-bar-fill"></div></div></div>
        </div>

        <div class="box-info box-green" id="text-point-fort"><b>✅ POINT FORT</b><br>Communication claire et efficace.</div>
        <div class="box-info box-orange" id="text-axe-amelio"><b>🚀 AMÉLIORATION</b><br>Prendre plus d'initiatives.</div>
        
        <button class="btn-nav btn-next" style="width: 100%;" onclick="location.reload()">Reset</button>
    </div>
</div>

<script>
    let currentLang = 'fr';
    let currentIdx = 0;
    let answers = new Array(16).fill(null);

    const uiTexts = {
        fr: { sub: "Rapport de Leadership", title: "Analyse de Style", desc: "16 situations simples.", start: "Commencer", prev: "Retour", next: "Suivant", res: "Résultats", global: "Leadership Global", social: "Social", vision: "Vision", fort: "<b>✅ POINT FORT</b><br>Communication claire.", axe: "<b>🚀 AMÉLIORATION</b><br>Prendre des initiatives." },
        ar: { sub: "تقرير القيادة", title: "تحليل الأسلوب", desc: "16 موقفاً بسيطاً.", start: "ابدأ", prev: "رجوع", next: "التالي", res: "النتائج", global: "القيادة العامة", social: "اجتماعي", vision: "رؤية", fort: "<b>✅ نقطة قوة</b><br>تواصل واضح.", axe: "<b>🚀 تحسين</b><br>المبادرة أكثر." },
        en: { sub: "Leadership Report", title: "Style Analysis", desc: "16 simple situations.", start: "Start", prev: "Back", next: "Next", res: "Results", global: "Global Leadership", social: "Social", vision: "Vision", fort: "<b>✅ STRENGTH</b><br>Clear communication.", axe: "<b>🚀 IMPROVEMENT</b><br>Take initiatives." }
    };

    const questionsData = [
        { fr: { q: "Comment donnez-vous des ordres ?", options: ["Directement", "En discutant"] }, ar: { q: "كيف تعطي الأوامر؟", options: ["مباشرة", "بالنقاش"] }, en: { q: "How do you give orders?", options: ["Directly", "By discussing"] } },
        { fr: { q: "Un problème arrive, vous :", options: ["Décidez seul", "Demandez l'avis"] }, ar: { q: "حدثت مشكلة، أنت:", options: ["تقرر وحدك", "تطلب الرأي"] }, en: { q: "A problem occurs, you:", options: ["Decide alone", "Ask for advice"] } },
        { fr: { q: "Votre priorité est :", options: ["Le travail fini", "L'ambiance d'équipe"] }, ar: { q: "أولويتك هي:", options: ["إنجاز العمل", "جو الفريق"] }, en: { q: "Your priority is:", options: ["Work finished", "Team atmosphere"] } },
        { fr: { q: "Pour motiver quelqu'un :", options: ["Vous le contrôlez", "Vous l'encouragez"] }, ar: { q: "لتحفيز شخص ما:", options: ["تراقبه", "تشجعه"] }, en: { q: "To motivate someone:", options: ["You control them", "You encourage them"] } },
        { fr: { q: "Réunion d'équipe :", options: ["Vous parlez", "Vous écoutez"] }, ar: { q: "اجتماع الفريق:", options: ["تتحدث", "تستمع"] }, en: { q: "Team meeting:", options: ["You speak", "You listen"] } },
        { fr: { q: "Erreur d'un employé :", options: ["Sanctionner", "Expliquer"] }, ar: { q: "خطأ موظف:", options: ["عقوبة", "شرح"] }, en: { q: "Employee error:", options: ["Sanction", "Explain"] } },
        { fr: { q: "Changement de plan :", options: ["L'imposer", "En parler avant"] }, ar: { q: "تغيير الخطة:", options: ["فرضها", "التحدث عنها"] }, en: { q: "Plan change:", options: ["Impose it", "Talk about it"] } },
        { fr: { q: "Nouveau projet :", options: ["Tout vérifier", "Faire confiance"] }, ar: { q: "مشروع جديد:", options: ["فحص كل شيء", "الثقة"] }, en: { q: "New project:", options: ["Check everything", "Trust"] } },
        { fr: { q: "Les objectifs :", options: ["Fixes et clairs", "Souples"] }, ar: { q: "الأهداف:", options: ["ثابتة وواضحة", "مرنة"] }, en: { q: "The goals:", options: ["Fixed and clear", "Flexible"] } },
        { fr: { q: "Le leader idéal :", options: ["Un chef", "Un guide"] }, ar: { q: "القائد المثالي:", options: ["رئيس", "مرشد"] }, en: { q: "Ideal leader:", options: ["A boss", "A guide"] } },
        { fr: { q: "Conflit entre deux personnes :", options: ["Trancher", "Médiation"] }, ar: { q: "صراع بين شخصين:", options: ["الحسم", "الوساطة"] }, en: { q: "Conflict between two:", options: ["Settle it", "Mediation"] } },
        { fr: { q: "Feedback (avis) :", options: ["Direct", "Constructif"] }, ar: { q: "ملاحظات:", options: ["مباشرة", "بناءة"] }, en: { q: "Feedback:", options: ["Direct", "Constructive"] } },
        { fr: { q: "Déléguer :", options: ["C'est dur", "C'est utile"] }, ar: { q: "التفويض:", options: ["صعب", "مفيد"] }, en: { q: "Delegating:", options: ["It's hard", "It's useful"] } },
        { fr: { q: "Innovation :", options: ["Risqué", "Nécessaire"] }, ar: { q: "الابتكار:", options: ["خطر", "ضروري"] }, en: { q: "Innovation:", options: ["Risky", "Necessary"] } },
        { fr: { q: "La discipline :", options: ["Sévère", "Juste"] }, ar: { q: "الانضباط:", options: ["صارم", "عادل"] }, en: { q: "Discipline:", options: ["Severe", "Fair"] } },
        { fr: { q: "L'équipe :", options: ["Des exécutants", "Des partenaires"] }, ar: { q: "الفريق:", options: ["منفذون", "شركاء"] }, en: { q: "The team:", options: ["Executors", "Partners"] } }
    ];

    function changeLang(lang) {
        currentLang = lang;
        const cont = document.getElementById('main-container');
        if(lang === 'ar') cont.classList.add('rtl'); else cont.classList.remove('rtl');
        document.getElementById('text-sub-logo').innerText = uiTexts[lang].sub;
        document.getElementById('text-home-title').innerText = uiTexts[lang].title;
        document.getElementById('text-home-desc').innerText = uiTexts[lang].desc;
        document.getElementById('text-start-btn').innerText = uiTexts[lang].start;
        if(document.getElementById('quiz-card').style.display === 'block') render();
    }

    function startTest() {
        document.getElementById('home-card').style.display = 'none';
        document.getElementById('quiz-card').style.display = 'block';
        render();
    }

    function render() {
        const qData = questionsData[currentIdx][currentLang];
        document.getElementById('q-number').innerText = (currentLang === 'ar' ? 'السؤال' : 'QUESTION') + ` ${currentIdx + 1} / 16`;
        document.getElementById('q-text').innerText = qData.q;
        const optContainer = document.getElementById('options');
        optContainer.innerHTML = '';
        qData.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = `option-btn ${answers[currentIdx] === i ? 'selected' : ''}`;
            btn.innerText = opt;
            btn.onclick = () => { answers[currentIdx] = i; render(); };
            optContainer.appendChild(btn);
        });
        document.getElementById('progress').style.width = ((currentIdx + 1) / 16 * 100) + '%';
        const isLast = currentIdx === 15;
        document.getElementById('next-btn').style.display = isLast ? 'none' : 'inline-block';
        document.getElementById('result-btn').style.display = isLast ? 'inline-block' : 'none';
        document.getElementById('next-btn').disabled = answers[currentIdx] === null;
        document.getElementById('next-btn').innerText = uiTexts[currentLang].next;
        document.getElementById('result-btn').innerText = uiTexts[currentLang].res;
    }

    function changeQuestion(dir) { currentIdx += dir; render(); }
    function finish() {
        document.getElementById('quiz-card').style.display = 'none';
        document.getElementById('result-card').style.display = 'block';
    }
</script>
</body>
</html>
