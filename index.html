<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSL - Experience Leadership</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6; /* Violet MBTI */
            --primary-dark: #6d28d9;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        /* --- Language Switcher --- */
        .lang-switcher {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white; padding: 8px 12px; border-radius: 12px;
            cursor: pointer; z-index: 100; font-family: inherit;
        }

        .container { width: 95%; max-width: 550px; }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* --- Style Resultats Violet --- */
        .result-header {
            background: var(--primary);
            padding: 25px;
            border-radius: 16px;
            margin: 20px 0;
        }

        .type-title { font-size: 3rem; font-weight: 800; letter-spacing: 4px; margin-bottom: 5px; }
        .type-subtitle { font-size: 1rem; opacity: 0.9; }

        .mbti-bar-container { margin: 12px 0; text-align: left; }
        .mbti-label { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 4px; font-weight: 600; }
        .mbti-bar-bg { background: rgba(255, 255, 255, 0.1); height: 8px; border-radius: 10px; overflow: hidden; }
        .mbti-bar-fill { background: #a78bfa; height: 100%; transition: 1s ease-out; }

        .description-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            margin-top: 20px;
            font-size: 0.85rem;
            line-height: 1.5;
            border: 1px solid var(--glass-border);
        }

        /* --- Buttons & UI --- */
        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 15px;
            width: 100%;
            border-radius: 12px;
            margin-bottom: 10px;
            text-align: left;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }
        .option-btn.selected { background: var(--primary); border-color: var(--primary); }

        .btn-nav { 
            padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; 
            border: none; text-transform: uppercase; transition: 0.3s;
        }
        .btn-next { background: var(--primary); color: white; width: 100%; margin-top: 10px; }
        
        .progress-bar { background: rgba(255,255,255,0.05); height: 6px; border-radius: 10px; margin-bottom: 20px; }
        .progress-fill { background: var(--primary); height: 100%; width: 0%; border-radius: 10px; transition: 0.3s; }

        .rtl { direction: rtl; text-align: right; }
        .rtl .option-btn { text-align: right; }
        .rtl .mbti-bar-container { text-align: right; }

    </style>
</head>
<body>

    <select class="lang-switcher" onchange="changeLang(this.value)">
        <option value="fr">Français</option>
        <option value="ar">العربية</option>
        <option value="en">English</option>
    </select>

<div class="container" id="main-container">
    <div id="home-card" class="card">
        <h2 id="t-home-title" style="margin-bottom: 15px;">TSL</h2>
        <p id="t-home-desc" style="color: var(--text-muted); margin-bottom: 25px;">Découvrez votre type de leadership en 16 questions.</p>
        <button id="t-start-btn" class="btn-nav btn-next" onclick="startTest()">Commencer le test</button>
    </div>

    <div id="quiz-card" class="card" style="display: none;">
        <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
        <h3 id="q-text" style="margin-bottom: 20px;"></h3>
        <div id="options"></div>
        <button id="next-btn" class="btn-nav btn-next" onclick="nextQuestion()" disabled>Suivant</button>
    </div>

    <div id="result-card" class="card" style="display: none;">
        <p id="t-res-label" style="font-size: 0.8rem; font-weight: 600; color: var(--primary);">VOS RÉSULTATS</p>
        
        <div class="result-header">
            <h1 class="type-title">TSL</h1>
            <p id="t-res-sub" class="type-subtitle">Analyse de Style</p>
        </div>

        <div class="mbti-bar-container">
            <div class="mbti-label"><span id="t-bar-1">Social</span><span>80%</span></div>
            <div class="mbti-bar-bg"><div class="mbti-bar-fill" style="width: 80%;"></div></div>
        </div>
        <div class="mbti-bar-container">
            <div class="mbti-label"><span id="t-bar-2">Vision</span><span>65%</span></div>
            <div class="mbti-bar-bg"><div class="mbti-bar-fill" style="width: 65%;"></div></div>
        </div>
        <div class="mbti-bar-container">
            <div class="mbti-label"><span id="t-bar-3">Décision</span><span>90%</span></div>
            <div class="mbti-bar-bg"><div class="mbti-bar-fill" style="width: 90%;"></div></div>
        </div>

        <div id="t-res-desc" class="description-box">
            <p><b>Résultat Global :</b> Vous avez un profil équilibré avec une forte capacité à prendre des décisions tout en gardant une vision claire des objectifs.</p>
        </div>

        <button id="t-reset-btn" class="btn-nav" style="background: rgba(255,255,255,0.05); color: white; width: 100%; margin-top: 20px;" onclick="location.reload()">Recommencer</button>
    </div>
</div>

<script>
    let currentIdx = 0;
    let selectedOpt = null;
    let currentLang = 'fr';
    const totalQ = 16;

    const uiTexts = {
        fr: { homeT: "Test de Personnalité", homeD: "Découvrez votre type de leadership en 16 questions.", start: "Commencer le test", next: "Suivant", resL: "VOS RÉSULTATS", resS: "Analyse de Style", bar1: "Social", bar2: "Vision", bar3: "Décision", reset: "Recommencer" },
        en: { homeT: "Personality Test", homeD: "Discover your leadership style in 16 questions.", start: "Start Test", next: "Next", resL: "YOUR RESULTS", resS: "Style Analysis", bar1: "Social", bar2: "Vision", bar3: "Decision", reset: "Restart" },
        ar: { homeT: "اختبار الشخصية", homeD: "اكتشف أسلوبك في القيادة من خلال 16 سؤالاً.", start: "ابدأ الاختبار", next: "التالي", resL: "نتائجك", resS: "تحليل الأسلوب", bar1: "اجتماعي", bar2: "رؤية", bar3: "قرار", reset: "إعادة الاختبار" }
    };

    const questions = [
        { fr: "Comment gérez-vous une urgence ?", ar: "كيف تتعامل مع حالة طوارئ؟", en: "How do you handle an emergency?", opts: { fr: ["Je décide immédiatement", "Je consulte l'équipe"], ar: ["أقرر فوراً", "أستشير الفريق"], en: ["I decide immediately", "I consult the team"] } },
        { fr: "Votre priorité au travail ?", ar: "أولويتك في العمل؟", en: "Your priority at work?", opts: { fr: ["Atteindre les objectifs", "Maintenir l'ambiance"], ar: ["تحقيق الأهداف", "الحفاظ على الجو العام"], en: ["Achieving goals", "Maintaining atmosphere"] } },
        { fr: "En réunion, vous préférez :", ar: "في الاجتماعات، تفضل:", en: "In meetings, you prefer:", opts: { fr: ["Donner des directives", "Écouter les avis"], ar: ["إعطاء التوجيهات", "الاستماع للآراء"], en: ["Give directions", "Listen to opinions"] } },
        { fr: "Pour motiver quelqu'un :", ar: "لتحفيز شخص ما:", en: "To motivate someone:", opts: { fr: ["Fixer des défis", "Offrir du soutien"], ar: ["تحديد تحديات", "تقديم الدعم"], en: ["Set challenges", "Offer support"] } },
        { fr: "Face à une erreur :", ar: "عند وقوع خطأ:", en: "Faced with an error:", opts: { fr: ["Chercher le coupable", "Chercher la solution"], ar: ["البحث عن المخطئ", "البحث عن حل"], en: ["Find the culprit", "Find the solution"] } },
        { fr: "Vous déléguez une tâche :", ar: "عند تفويض مهمة:", en: "When delegating a task:", opts: { fr: ["En contrôlant tout", "En faisant confiance"], ar: ["بمراقبة كل شيء", "بوضع الثقة"], en: ["By controlling everything", "By trusting"] } },
        { fr: "Le changement est :", ar: "التغيير بالنسبة لك:", en: "Change is:", opts: { fr: ["Une opportunité", "Un risque"], ar: ["فرصة", "خطر"], en: ["An opportunity", "A risk"] } },
        { fr: "Le climat idéal :", ar: "الجو المثالي:", en: "The ideal climate:", opts: { fr: ["Compétition saine", "Collaboration totale"], ar: ["تنافس شريف", "تعاون كامل"], en: ["Healthy competition", "Total collaboration"] } },
        { fr: "Vous préférez :", ar: "تفضل:", en: "You prefer:", opts: { fr: ["Planifier à l'avance", "S'adapter au moment"], ar: ["التخطيط مسبقاً", "التكيف مع اللحظة"], en: ["Plan in advance", "Adapt to the moment"] } },
        { fr: "Une critique est :", ar: "الانتقاد بالنسبة لك:", en: "A criticism is:", opts: { fr: ["Un outil de progrès", "Une attaque"], ar: ["أداة للتقدم", "هجوم شخصي"], en: ["A tool for progress", "An attack"] } },
        { fr: "Les règles sont :", ar: "القواعد بالنسبة لك:", en: "Rules are:", opts: { fr: ["Indispensables", "Flexibles"], ar: ["ضرورية جداً", "مرنة"], en: ["Essential", "Flexible"] } },
        { fr: "Succès d'un projet :", ar: "نجاح المشروع يعود لـ:", en: "Project success is due to:", opts: { fr: ["Le travail acharné", "L'esprit d'équipe"], ar: ["العمل الجاد", "روح الفريق"], en: ["Hard work", "Team spirit"] } },
        { fr: "Innovation :", ar: "الابتكار:", en: "Innovation:", opts: { fr: ["Explorer le nouveau", "Améliorer l'existant"], ar: ["استكشاف الجديد", "تحسين الموجود"], en: ["Explore the new", "Improve the existing"] } },
        { fr: "Communication :", ar: "التواصل:", en: "Communication:", opts: { fr: ["Directe et brève", "Détaillée et ouverte"], ar: ["مباشر ومختصر", "مفصل ومفتوح"], en: ["Direct and brief", "Detailed and open"] } },
        { fr: "Stress :", ar: "الضغط:", en: "Stress:", opts: { fr: ["Me rend productif", "Me ralentit"], ar: ["يجعلني منتجاً", "يبطئ حركتي"], en: ["Makes me productive", "Slows me down"] } },
        { fr: "Le leader est :", ar: "القائد هو:", en: "The leader is:", opts: { fr: ["Un modèle à suivre", "Un facilitateur"], ar: ["قدوة تتبع", "ميسر للأمور"], en: ["A role model", "A facilitator"] } }
    ];

    function changeLang(lang) {
        currentLang = lang;
        const main = document.getElementById('main-container');
        if (lang === 'ar') main.classList.add('rtl'); else main.classList.remove('rtl');
        
        document.getElementById('t-home-title').innerText = uiTexts[lang].homeT;
        document.getElementById('t-home-desc').innerText = uiTexts[lang].homeD;
        document.getElementById('t-start-btn').innerText = uiTexts[lang].start;
        document.getElementById('next-btn').innerText = uiTexts[lang].next;
        document.getElementById('t-res-label').innerText = uiTexts[lang].resL;
        document.getElementById('t-res-sub').innerText = uiTexts[lang].resS;
        document.getElementById('t-bar-1').innerText = uiTexts[lang].bar1;
        document.getElementById('t-bar-2').innerText = uiTexts[lang].bar2;
        document.getElementById('t-bar-3').innerText = uiTexts[lang].bar3;
        document.getElementById('t-reset-btn').innerText = uiTexts[lang].reset;
        
        if (document.getElementById('quiz-card').style.display === 'block') render();
    }

    function startTest() {
        document.getElementById('home-card').style.display = 'none';
        document.getElementById('quiz-card').style.display = 'block';
        render();
    }

    function render() {
        const q = questions[currentIdx];
        document.getElementById('q-text').innerText = q[currentLang];
        const optContainer = document.getElementById('options');
        optContainer.innerHTML = '';
        
        q.opts[currentLang].forEach((o, i) => {
            const btn = document.createElement('button');
            btn.className = `option-btn ${selectedOpt === i ? 'selected' : ''}`;
            btn.innerText = o;
            btn.onclick = () => { selectedOpt = i; document.getElementById('next-btn').disabled = false; render(); };
            optContainer.appendChild(btn);
        });

        document.getElementById('progress').style.width = ((currentIdx + 1) / totalQ * 100) + '%';
    }

    function nextQuestion() {
        if (currentIdx < totalQ - 1) {
            currentIdx++;
            selectedOpt = null;
            document.getElementById('next-btn').disabled = true;
            render();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-card').style.display = 'none';
        document.getElementById('result-card').style.display = 'block';
    }
</script>

</body>
</html>
